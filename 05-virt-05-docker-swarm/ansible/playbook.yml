---
- name: 'Playbook'
  hosts: nodes
  become: yes

  tasks:
    - name: Installing tools
      apt:
        name: "{{ item }}"
        state: present
        update_cache: yes
      with_items:
        - git
        - curl

    - name: Installing docker
      apt:
        name: docker.io
        state: present

    - name: Add the current user to docker group
      user:
        name: ubuntu
        append: yes
        groups: docker
